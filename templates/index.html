<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CertiMinds Assistant</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <div class="logo">CertiMinds</div>
    <div class="subtitle">Website Assistant</div>
  </div>
  <div class="chat-window" id="chat-window">
    <div class="message bot">Hi! I'm the CertiMinds assistant. Ask me about our Launchpad program, building a team, career opportunities, or anything else about CertiMinds.</div>
  </div>
  <div class="suggestions" id="suggestions">
    {% for question in suggestions %}
    <button class="suggestion-btn" onclick="askSuggestion(this)">{{ question }}</button>
    {% endfor %}
  </div>
  <div class="chat-input">
    <input type="text" id="user-input" placeholder="Type your question...">
    <button id="send-btn">Send</button>
  </div>
</div>
<script src="/static/script.js"></script>
</body>
</html>
